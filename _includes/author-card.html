{%- comment -%} Karta autora — prawa kolumna wpisu (desktop) / pod treścią (tablet, mobile). Dane w _config.yml → author {%- endcomment -%}
<div class="post-author">
  <div class="post-author-head">
    <img src="{{ site.author.avatar | relative_url }}" alt="" width="160" height="160" class="post-author-avatar" loading="lazy" decoding="async">
    <div>
      <p class="post-author-name">{{ site.author.name }}</p>
      <p class="post-author-role">{{ site.author.role }}</p>
    </div>
  </div>
  <div class="post-author-body">
    <p class="post-author-bio">{{ site.author.bio }}</p>
    <div class="post-author-actions">
      <a href="{{ '/kontakt.html' | relative_url }}" class="btn-primary post-author-cta">
        <span class="btn-cta-icon btn-cta-icon--sm" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </span>
        Bezpłatna konsultacja
      </a>
      <a href="{{ '/omnie.html' | relative_url }}" class="btn-text">Więcej o mnie
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </a>
    </div>
  </div>
</div>
