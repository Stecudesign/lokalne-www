{%- comment -%} Kopia bloku z oferta.html (nav + #mobile-menu / stopka). Zmieniasz nav lub stopkę na stronach statycznych — przenieś zmianę też tutaj. {%- endcomment -%}
<nav id="nav">
  <div class="nav-wrapper">

    <!-- Floating pill: grid 1fr auto 1fr → brand / linki / CTA.
         Wysokość i „szkło" pilla animuje GSAP (stan hero ↔ stan compact). -->
    <div class="nav-bar">

      <a href="{{ '/' | relative_url }}" class="nav-logo" aria-label="lokalnewww.pl — strona główna">
        <img src="{{ '/img/logopin3Dv1.webp' | relative_url }}" alt="" class="logo-img" width="325" height="305">
        <span class="logo-text">
          <span>lokalne</span><span>www.pl</span>
        </span>
      </a>

      <div class="nav-links-pill">
        <a href="{{ '/oferta.html' | relative_url }}">Oferta</a>
        <a href="{{ '/omnie.html' | relative_url }}">O mnie</a>
        <a href="{{ '/proces.html' | relative_url }}">Proces</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.nav_active == "blog" %} class="is-active" aria-current="page"{% endif %}>Blog</a>
        <a href="{{ '/kontakt.html' | relative_url }}">Kontakt</a>
      </div>

      <div class="nav-actions">
        <a href="{{ '/kontakt.html' | relative_url }}" class="btn-nav-brand">
          <span class="btn-cta-icon btn-cta-icon--sm" aria-hidden="true">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </span>
          Bezpłatna konsultacja
        </a>
        <button data-menu-toggle class="nav-hamburger" aria-label="Otwórz menu" aria-expanded="false" aria-controls="mobile-menu">
          <span class="ham-line"></span>
          <span class="ham-line"></span>
          <span class="ham-line"></span>
        </button>
      </div>

    </div>
  </div>
</nav>

<!-- Mobile menu -->
<div id="mobile-menu" role="dialog" aria-modal="true" aria-label="Menu nawigacyjne">
  <button data-menu-close class="close-btn" aria-label="Zamknij menu">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M18 6 6 18M6 6l12 12"/>
    </svg>
  </button>
  <a href="{{ '/oferta.html' | relative_url }}" data-menu-link>Oferta</a>
  <a href="{{ '/omnie.html' | relative_url }}" data-menu-link>O mnie</a>
  <a href="{{ '/proces.html' | relative_url }}" data-menu-link>Proces</a>
  <a href="{{ '/blog/' | relative_url }}" data-menu-link{% if page.nav_active == "blog" %} aria-current="page"{% endif %}>Blog</a>
  <a href="{{ '/kontakt.html' | relative_url }}" data-menu-link>Kontakt</a>
  <a href="{{ '/kontakt.html' | relative_url }}" data-menu-link class="btn-primary mt-2">
    <span class="btn-cta-icon" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </span>
    Bezpłatna konsultacja
  </a>
</div>
