{%- assign p = include.post -%}
<article class="blog-card" data-category="{{ p.category | slugify }}" data-search="{{ p.title | append: ' ' | append: p.description | append: ' ' | append: p.category | downcase | escape }}">
  <div class="blog-card-media">
    <img src="{{ p.thumb | default: p.image | relative_url }}" alt="" width="720" height="405" loading="lazy" decoding="async">
  </div>
  <div class="blog-card-body">
    <div class="blog-card-meta">
      <span class="blog-tag">{{ p.category }}</span>
      {% include date-pl.html date=p.date %}
    </div>
    <h3 class="blog-card-title"><a href="{{ p.url | relative_url }}">{{ p.title }}</a></h3>
    <p class="blog-card-desc">{{ p.description }}</p>
  </div>
  <div class="blog-card-foot">
    <span class="blog-byline">
      <img src="{{ site.author.avatar | relative_url }}" alt="" width="80" height="80" class="blog-avatar">
      {{ site.author.name }}
    </span>
    <span class="blog-card-read">{% include reading-time.html content=p.content %}</span>
  </div>
</article>
