<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ============================================================
       PRZEKIEROWANIE — strona „O mnie" przeniosła się z /o-mnie na /omnie (18.09.2026).
       Ten plik istnieje wyłącznie po to, żeby stary adres nie zwracał 404.
       GitHub Pages to hosting statyczny — nie da się tu ustawić przekierowania 301
       po stronie serwera, więc robi to meta refresh + location.replace().
       Brak <meta name="robots" content="noindex"> jest CELOWY: przy noindex
       wyszukiwarka mogłaby potraktować sygnał jako dotyczący celu przekierowania.
       Canonical wskazuje nowy adres, żeby przenieść wartość SEO na /omnie.
       ============================================================ -->

  <title>Przekierowanie — O mnie | lokalnewww.pl</title>
  <link rel="canonical" href="https://lokalnewww.pl/omnie">
  <meta http-equiv="refresh" content="0; url=omnie.html">
  <script>
    // Zachowuje kotwicę i query string; replace() nie zostawia wpisu w historii,
    // więc „wstecz" nie wpada w pętlę przekierowania.
    location.replace('omnie.html' + location.search + location.hash);
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
      color: #0F172A;
      background: #F8FAFC;
      text-align: center;
      padding: 1.5rem;
    }
    a { color: #2563EB; }
  </style>
</head>
<body>
  <!-- Widoczne tylko gdy JS jest wyłączony, a przeglądarka blokuje meta refresh -->
  <p>Ta strona jest teraz pod adresem <a href="omnie.html">/omnie</a>.</p>
</body>
</html>
